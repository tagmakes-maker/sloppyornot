name = "sloppyornot"
main = "src/index.js"
compatibility_date = "2026-10-01"

# One KV namespace for everything. Keys:
#   product:<id>   Product Profile JSON (shared/profile.schema.json)
#   reviews:<id>   list of swipe answers
#   contact:<id>   {email, at} the owner shared at submit. Never in the profile.
#   rejections     list of {a_id, b_id, reason, at}
#   agentlog       list of agent entries, newest last
# Sloppy or Not judge (issue #40, docs/build-judge-routes.md):
#   judge:<id>     private scores and verdict. Never returned, except a verdict on /ridicule.
#   card:<id>      {likes_and_goals, brings} for the public Judge screen
#   thumb:<id>     thumbnail bytes, metadata {contentType}
#   url:<url>      product id for a normalized url, so the first verdict is reused
#   votes:<id>     {slop, not, list} from the Judge screen. Never returned.
#   subscriber:<email>  {email, product_id, subscribed_at, unsubscribe_token}, lowercased key. Never returned.
#   emailed:<email>:<id>  one results email per address per project per day. Expires on its own.
#   limit:...      counters for the /judge cap. Expire on their own.
# Created Oct 24 in the dashboard (Workers KV > STORE).
# `npm run dev` (Wrangler 4) uses a local copy of this namespace, so testing never touches live data.
# Only `wrangler dev --remote` would use the live one.
[[kv_namespaces]]
binding = "STORE"
id = "ccf3f3081542491c96020fe1e679c8ac"
preview_id = "ccf3f3081542491c96020fe1e679c8ac"
[vars]
PROMPTS_BASE = "https://raw.githubusercontent.com/tagmakes-maker/sloppyornot/main/agent/prompts/"
ANTHROPIC_MODEL = "claude-opus-5-5"
# the Tagmakes account, for the Browser Rendering REST endpoints
CF_ACCOUNT_ID = "24e9a7cf816f435cac65da9daef6dc82"
# results email sender. aitechgirlfriends.com is verified in Resend.
RESEND_FROM = "Sloppy or Not <results@aitechgirlfriends.com>"

# Secrets (never in this file): npx wrangler secret put ANTHROPIC_API_KEY
# RESEND_KEY sends the results email after POST /judge/:id/email. Without it signups still save.
# Optional: PAGESPEED_API_KEY raises Google's PageSpeed quota. Without it /judge still works.
# CF_BROWSER_TOKEN (Browser Rendering Edit) turns on screenshots and rendered pages. Without it /judge
# falls back to a plain fetch and og:image. For local dev it also goes in worker/.dev.vars.
# Local dev: copy ../.env.example to worker/.dev.vars and fill it in
