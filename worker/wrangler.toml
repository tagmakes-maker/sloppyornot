name = "sloppyornot"
main = "src/index.js"
compatibility_date = "2026-10-01"

# One KV namespace for everything. Keys:
#   product:<id>   Product Profile JSON (shared/profile.schema.json)
#   reviews:<id>   list of swipe answers
#   rejections     list of {a_id, b_id, reason, at}
#   agentlog       list of agent entries, newest last
# Created Oct 24 in the dashboard (Workers KV > STORE).
# Local dev and production share this one namespace for the weekend.
[[kv_namespaces]]
binding = "STORE"
id = "ccf3f3081542491c96020fe1e679c8ac"
preview_id = "ccf3f3081542491c96020fe1e679c8ac"
[vars]
PROMPTS_BASE = "https://raw.githubusercontent.com/tagmakes-maker/sloppyornot/main/agent/prompts/"
ANTHROPIC_MODEL = "claude-opus-5-5"

# Secrets (never in this file): npx wrangler secret put ANTHROPIC_API_KEY
# Local dev: copy ../.env.example to worker/.dev.vars and fill it in
